# 宝塔网站「配置文件」模板
# 将 lianyipei.example.com 和项目绝对路径替换为实际值。
# 宝塔面板的 SSL 证书配置应放在同一个 server 块中或由面板自动生成。

server {
    listen 80;
    listen [::]:80;
    server_name lianyipei.example.com;

    client_max_body_size 16m;
    client_body_timeout 60s;

    # Vite 构建产物：app/static/frontend
    location /static/ {
        alias /www/wwwroot/lianyipei/app/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # 其余页面、登录、API、上传下载全部由 Flask 处理。
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }

    # /api/chat 使用 SSE，必须关闭代理缓冲，否则浏览器会长时间收不到增量文本。
    location /api/chat {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
    }
}
