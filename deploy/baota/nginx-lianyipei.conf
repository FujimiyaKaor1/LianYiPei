# 宝塔网站「配置文件」模板（这是站点 server 片段，不是完整 nginx.conf）
# 将 lianyipei.example.com 和项目绝对路径替换为实际值。
# 请在宝塔 SSL 模块中启用 HTTPS，并让面板把证书指令合并到 443 server
# 块；不要在没有 TLS、限流和安全响应头的情况下把此 HTTP 片段直接暴露到公网。
# 如果面板生成独立的 80->443 跳转 server，请保留下面的代理配置在 443 块中。

server {
    listen 80;
    listen [::]:80;
    server_name lianyipei.example.com;

    client_max_body_size 16m;
    client_body_timeout 60s;

    # Vite 构建产物：app/static/frontend
    location /static/ {
        alias /www/wwwroot/lianyipei/app/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # 其余页面、登录、API、上传下载全部由 Flask 处理。
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }

    # /api/chat 使用 SSE，必须关闭代理缓冲，否则浏览器会长时间收不到增量文本。
    location /api/chat {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
    }
}
