[program:lianyipei-email-worker]
directory=/www/wwwroot/lianyipei
command=/www/wwwroot/lianyipei/.venv/bin/python scripts/workers/email_quote_poller.py
user=www
autostart=false
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
environment=APP_ENV="production",INBOUND_EMAIL_ENABLED="true"
stdout_logfile=/var/log/lianyipei/email-worker.log
stderr_logfile=/var/log/lianyipei/email-worker-error.log
stopwaitsecs=30
