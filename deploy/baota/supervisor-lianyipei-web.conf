[program:lianyipei-web]
directory=/www/wwwroot/lianyipei
command=/www/wwwroot/lianyipei/.venv/bin/gunicorn wsgi:app --bind 127.0.0.1:8000 --workers 2 --timeout 120 --access-logfile /var/log/lianyipei/web-access.log --error-logfile /var/log/lianyipei/web-error.log
user=www
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
environment=APP_ENV="production",FLASK_ENV="production",SCHEDULER_ENABLED="0"
stdout_logfile=/var/log/lianyipei/web-supervisor.log
stderr_logfile=/var/log/lianyipei/web-supervisor-error.log
