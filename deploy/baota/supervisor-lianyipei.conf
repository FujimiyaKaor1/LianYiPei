; 宝塔「Supervisor 管理器」配置模板
; 部署前将 /www/wwwroot/lianyipei 改为实际项目目录。
; 根目录 .env 中应设置 SCHEDULER_ENABLED=0；调度器由下面第二个进程单独启用。

[program:lianyipei-web]
directory=/www/wwwroot/lianyipei
user=www
command=/www/wwwroot/lianyipei/.venv/bin/gunicorn "app:create_app()" --bind 127.0.0.1:8000 --workers 2 --threads 4 --timeout 120 --graceful-timeout 30 --keep-alive 5 --access-logfile - --error-logfile -
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=45
stdout_logfile=/www/wwwroot/lianyipei/logs/web.log
stderr_logfile=/www/wwwroot/lianyipei/logs/web-error.log
environment=LIANYIPEI_SCHEDULER_ENABLED="0",PYTHONUNBUFFERED="1"

[program:lianyipei-scheduler]
directory=/www/wwwroot/lianyipei
user=www
command=/www/wwwroot/lianyipei/.venv/bin/python scripts/run_scheduler.py
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=45
stdout_logfile=/www/wwwroot/lianyipei/logs/scheduler.log
stderr_logfile=/www/wwwroot/lianyipei/logs/scheduler-error.log
environment=PYTHONUNBUFFERED="1"
